name: Test eic-shell

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-docker:
    name: Test with Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build minimal test container
        run: |
          docker build -t local/test:latest - << 'EOF'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends bash coreutils grep && rm -rf /var/lib/apt/lists/*
          RUN echo 'export EIC_ENV_LOADED=1' > /etc/eic-env.sh
          RUN mkdir -p /opt/local/bin /opt/local/sbin
          RUN printf '#!/usr/bin/env bash\n. /etc/eic-env.sh\nexec "$@"\n' > /opt/local/sbin/entrypoint.sh && chmod +x /opt/local/sbin/entrypoint.sh
          RUN printf '#!/usr/bin/env bash\npiped_args=()\nif [ -p /dev/stdin ]; then while IFS= read line; do piped_args+=("${line}"); done; fi\n. /etc/eic-env.sh\nif [ "${#piped_args[@]}" != "0" ]; then printf "%%s\\n" "${piped_args[@]}" | bash -s -- --norc --noprofile; elif [ $# -gt 0 ]; then exec bash -c "$@"; else exec bash --norc --noprofile; fi\n' > /opt/local/bin/eic-shell && chmod +x /opt/local/bin/eic-shell
          RUN ln -sf /opt/local/bin/eic-shell /usr/local/bin/eic-shell
          ENV PATH=/opt/local/bin:$PATH
          ENTRYPOINT ["/opt/local/sbin/entrypoint.sh"]
          EOF

      - name: Install eic-shell (Docker mode)
        run: |
          mkdir -p test-docker-env
          ./install.sh -o local -c test -v latest -p "$PWD/test-docker-env" -d

      - name: Run test suite against Docker launcher
        run: |
          tests/test_eic_shell.sh test-docker-env/eic-shell

  test-apptainer:
    name: Test with Apptainer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Apptainer and squashfuse
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update
          sudo apt-get install -y apptainer squashfuse

      - name: Build minimal test container and SIF
        run: |
          docker build -t local/test:latest - << 'EOF'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends bash coreutils grep && rm -rf /var/lib/apt/lists/*
          RUN echo 'export EIC_ENV_LOADED=1' > /etc/eic-env.sh
          RUN mkdir -p /opt/local/bin /opt/local/sbin
          RUN printf '#!/usr/bin/env bash\n. /etc/eic-env.sh\nexec "$@"\n' > /opt/local/sbin/entrypoint.sh && chmod +x /opt/local/sbin/entrypoint.sh
          RUN printf '#!/usr/bin/env bash\npiped_args=()\nif [ -p /dev/stdin ]; then while IFS= read line; do piped_args+=("${line}"); done; fi\n. /etc/eic-env.sh\nif [ "${#piped_args[@]}" != "0" ]; then printf "%%s\\n" "${piped_args[@]}" | bash -s -- --norc --noprofile; elif [ $# -gt 0 ]; then exec bash -c "$@"; else exec bash --norc --noprofile; fi\n' > /opt/local/bin/eic-shell && chmod +x /opt/local/bin/eic-shell
          RUN ln -sf /opt/local/bin/eic-shell /usr/local/bin/eic-shell
          ENV PATH=/opt/local/bin:$PATH
          ENTRYPOINT ["/opt/local/sbin/entrypoint.sh"]
          EOF

          mkdir -p test-apptainer-env/local/lib
          apptainer build test-apptainer-env/local/lib/test-latest.sif docker-daemon:local/test:latest

      - name: Install eic-shell (Apptainer mode)
        run: |
          ./install.sh -o local -c test -v latest -p "$PWD/test-apptainer-env" -n

      - name: Run test suite against Apptainer launcher
        run: |
          tests/test_eic_shell.sh test-apptainer-env/eic-shell
